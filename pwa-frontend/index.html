<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CivicGuard — Reportes de infraestructura urbana</title>
    <meta
      name="description"
      content="Reporta baches, luminarias y fugas de agua con GPS y foto, incluso sin conexión."
    />
    <meta name="theme-color" content="#0b3d91" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CivicGuard" />

    <!-- CSS crítico en línea (Application Shell inmutable) -->
    <style>
      :root {
        --brand: #0b3d91;
        --brand-strong: #082c6b;
        --bg: #f4f6fb;
        --surface: #ffffff;
        --text: #10182b;
        --muted: #5a6478;
        --border: #d9dfea;
        --danger: #b3261e;
        --radius: 14px;
        --gap: 16px;
        --shadow: 0 1px 2px rgb(16 24 43 / 8%), 0 6px 20px rgb(16 24 43 / 6%);
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
          Arial, "Noto Sans", sans-serif;
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --surface: #161b24;
          --text: #eef2f8;
          --muted: #a4aec0;
          --border: #2a3240;
          --shadow: none;
        }
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.5;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      h1,
      h2 {
        margin: 0;
        line-height: 1.25;
      }

      .skip-link {
        position: absolute;
        left: -9999px;
        top: 0;
        background: var(--surface);
        color: var(--text);
        padding: 12px 16px;
        border-radius: 0 0 var(--radius) 0;
        z-index: 10;
      }

      .skip-link:focus {
        left: 0;
      }

      :focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 2px;
      }

      .app-header {
        background: var(--brand);
        color: #fff;
        padding: 20px 16px calc(20px + env(safe-area-inset-bottom) * 0);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        max-width: 720px;
        margin: 0 auto;
      }

      .brand__mark {
        flex: none;
        width: 40px;
        height: 40px;
      }

      .brand__name {
        font-size: 1.375rem;
        letter-spacing: 0.01em;
      }

      .brand__tagline {
        max-width: 720px;
        margin: 6px auto 0;
        font-size: 0.9375rem;
        color: #d8e2f8;
      }

      .banner {
        margin: 0;
        padding: 12px 16px;
        background: #fff4d6;
        color: #4a3a05;
        border-bottom: 1px solid #e8d59a;
        font-size: 0.9375rem;
        text-align: center;
      }

      @media (prefers-color-scheme: dark) {
        .banner {
          background: #3a3011;
          color: #ffe9ad;
          border-bottom-color: #5a4a17;
        }
      }

      .app-main {
        flex: 1;
        width: 100%;
        max-width: 720px;
        margin: 0 auto;
        padding: var(--gap);
        display: grid;
        gap: var(--gap);
        align-content: start;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: var(--gap);
      }

      .card__title {
        font-size: 1.0625rem;
        margin-bottom: 12px;
      }

      .form {
        display: grid;
        gap: 14px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field__label {
        font-size: 0.875rem;
        font-weight: 600;
      }

      .field__hint {
        font-size: 0.8125rem;
        color: var(--muted);
      }

      input[type="text"],
      input[type="search"],
      textarea {
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
      }

      textarea {
        min-height: 96px;
        resize: vertical;
      }

      .button {
        min-height: 48px;
        padding: 12px 20px;
        font: inherit;
        font-weight: 600;
        color: #fff;
        background: var(--brand);
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }

      .button:active {
        background: var(--brand-strong);
        transform: scale(0.99);
      }

      .button[disabled] {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .button--ghost {
        color: var(--brand);
        background: transparent;
        border: 1px solid var(--brand);
      }

      .evidence {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }

      .list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .list__empty {
        color: var(--muted);
        font-size: 0.9375rem;
      }

      .app-footer {
        padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
        text-align: center;
        color: var(--muted);
        font-size: 0.8125rem;
      }

      .noscript {
        margin: var(--gap);
        padding: 12px 16px;
        background: #fdecea;
        color: var(--danger);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <header class="app-header">
      <div class="brand">
        <svg
          class="brand__mark"
          viewBox="0 0 48 48"
          role="img"
          aria-label="CivicGuard"
          focusable="false"
        >
          <circle cx="24" cy="24" r="21" fill="none" stroke="#fff" stroke-width="4" />
          <circle cx="24" cy="24" r="6" fill="#fff" />
        </svg>
        <h1 class="brand__name">CivicGuard</h1>
      </div>
      <p class="brand__tagline">Reporta incidencias urbanas, con o sin conexión.</p>
    </header>

    <!-- Estado de red: lo actualiza el EventBus (Sprint 2) -->
    <p id="offline-banner" class="banner" role="status" aria-live="polite" hidden>
      Sin conexión — tus reportes se guardan en el dispositivo.
    </p>

    <main id="main" class="app-main">
      <noscript>
        <p class="noscript">
          CivicGuard necesita JavaScript para funcionar sin conexión.
        </p>
      </noscript>

      <!-- Placeholder estático: el formulario se hidrata por CSR en Sprint 2 -->
      <section class="card" aria-labelledby="report-title">
        <h2 class="card__title" id="report-title">Nuevo reporte</h2>
        <form class="form" id="report-form" novalidate>
          <div class="field">
            <label class="field__label" for="report-title-input">Título</label>
            <input
              id="report-title-input"
              name="title"
              type="text"
              maxlength="120"
              autocomplete="off"
              placeholder="Bache en la calle 5 de Mayo"
            />
          </div>

          <div class="field">
            <label class="field__label" for="report-description">Descripción</label>
            <textarea
              id="report-description"
              name="description"
              maxlength="600"
              placeholder="Describe el problema y una referencia del lugar."
            ></textarea>
          </div>

          <div class="field">
            <span class="field__label">Evidencia</span>
            <div class="evidence">
              <button class="button button--ghost" type="button" id="capture-evidence">
                Capturar GPS y foto
              </button>
              <span class="field__hint" id="evidence-status">Sin datos todavía</span>
            </div>
          </div>

          <button class="button" type="submit" id="submit-report">Guardar reporte</button>
        </form>
      </section>

      <!-- Placeholder estático: la lista se renderiza por CSR en Sprint 3 -->
      <section class="card" aria-labelledby="list-title">
        <h2 class="card__title" id="list-title">Reportes</h2>
        <ul class="list" id="incident-list">
          <li class="list__empty">Aún no hay reportes en este dispositivo.</li>
        </ul>
      </section>
    </main>

    <footer class="app-footer">
      <span id="pending-counter">0 pendientes de sincronizar</span>
    </footer>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
